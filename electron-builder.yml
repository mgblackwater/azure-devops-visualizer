appId: com.adoviz.app
productName: ADO Visualizer
asar: true
directories:
  output: release/${version}
  buildResources: build
files:
  - out/**/*
  - package.json
  # Tray icon PNGs (16+@2x, regular + Template variant for macOS).
  # Resolved at runtime via `app.getAppPath()` / `electron/assets/...`
  # so the same code path works in dev (project root) and in prod
  # (asar root). See electron/notifications/tray.ts.
  - electron/assets/**
extraMetadata:
  main: out/main/main.js
win:
  target:
    - target: nsis
      arch:
        - x64
  artifactName: ${productName}-${version}-Setup.${ext}
nsis:
  oneClick: false
  perMachine: false
  allowToChangeInstallationDirectory: true
  createDesktopShortcut: true
  createStartMenuShortcut: true
  shortcutName: ADO Visualizer
mac:
  target:
    - target: dmg
      arch:
        - x64
        - arm64
  category: public.app-category.developer-tools
linux:
  target:
    - AppImage
  category: Development
publish: null
