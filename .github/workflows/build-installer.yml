name: Build Installers

# Triggers:
#  - push to main          → build Windows + macOS, upload as workflow artifacts
#  - tag push (v*.*.*)     → build both, then publish a single GitHub Release
#                            containing the Windows installer + macOS dmg
#  - manual workflow run   → build both, upload artifacts (handy for ad-hoc builds)
on:
  push:
    branches: [main]
    tags: ['v*.*.*']
  workflow_dispatch:

permissions:
  # Required by softprops/action-gh-release to create the Release on tag pushes.
  contents: write

concurrency:
  # Cancel an in-flight main build if a newer commit lands so we don't waste
  # runner minutes on a stale revision. Tag builds get their own group so a
  # rapid tag push won't cancel a main build mid-flight.
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build (${{ matrix.label }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45

    strategy:
      # Keep going if one platform breaks — uploading whichever side built
      # successfully is more useful than aborting both.
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            label: windows-x64
            builder-args: '--win --x64'
            # NSIS installer plus its blockmap. Glob is loose to tolerate
            # version-numbered subfolders under release/.
            artifact-glob: |
              release/**/*-Setup.exe
              release/**/*-Setup.exe.blockmap
          - os: macos-latest
            label: macos
            # `--mac` builds dmg for both x64 and arm64 per electron-builder.yml.
            # arm64 is the modern Apple Silicon target; keeping x64 covers
            # legacy Intel Macs your colleagues might still have.
            builder-args: '--mac --x64 --arm64'
            artifact-glob: |
              release/**/*.dmg
              release/**/*.dmg.blockmap

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Build renderer + main process
        run: npm run build

      - name: Package installer
        # `--publish never` keeps electron-builder from trying to upload to
        # any remote target — we hand assets to the release job ourselves.
        # `CSC_IDENTITY_AUTO_DISCOVERY=false` silences the "no signing
        # identity found" warning on macOS; we ship unsigned dmgs since
        # signing requires an Apple Developer account ($99/yr). Users can
        # bypass Gatekeeper on first launch via right-click → Open, or
        # `xattr -cr "/Applications/Workthread.app"` if quarantined.
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: false
        run: npx electron-builder ${{ matrix.builder-args }} --publish never

      - name: List build output
        # Useful when debugging path mismatches in the upload step.
        if: always()
        shell: bash
        run: |
          if [ -d release ]; then
            find release -type f \( -name '*.exe' -o -name '*.dmg' -o -name '*.blockmap' \) -print -exec ls -lh {} \;
          else
            echo "No release/ directory produced."
          fi

      - name: Upload installer artifact
        uses: actions/upload-artifact@v4
        with:
          name: workthread-${{ matrix.label }}-${{ github.sha }}
          path: ${{ matrix.artifact-glob }}
          if-no-files-found: error
          retention-days: 90

  release:
    # Combine artifacts from both platforms into a single GitHub Release.
    # Only fires on `v*.*.*` tag pushes — regular main pushes and manual
    # runs just produce workflow artifacts (downloadable from the Actions
    # tab) so we don't accidentally publish a release per commit.
    name: Publish GitHub Release
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Download all build artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Show downloaded files
        run: find artifacts -type f -print

      - name: Publish Release
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          fail_on_unmatched_files: true
          files: |
            artifacts/**/*-Setup.exe
            artifacts/**/*-Setup.exe.blockmap
            artifacts/**/*.dmg
            artifacts/**/*.dmg.blockmap
